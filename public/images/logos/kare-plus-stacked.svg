<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 860 840"
  role="img"
  aria-labelledby="kare-plus-stacked-title kare-plus-stacked-desc"
>
  <title id="kare-plus-stacked-title">Kare Plus</title>
  <desc id="kare-plus-stacked-desc">
    Stacked Kare Plus logo in blue with the tagline The Caring Company in green.
  </desc>
  <defs>
    <linearGradient id="kare-plus-stacked-blue" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0f3f92" />
      <stop offset="55%" stop-color="#1d58af" />
      <stop offset="100%" stop-color="#2ea2e6" />
    </linearGradient>
    <linearGradient id="kare-plus-stacked-green" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#a8e441" />
      <stop offset="100%" stop-color="#69bf33" />
    </linearGradient>
    <filter id="kare-plus-stacked-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#163d7d" flood-opacity="0.2" />
    </filter>
  </defs>

  <g
    fill="url(#kare-plus-stacked-blue)"
    filter="url(#kare-plus-stacked-shadow)"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-weight="900"
    letter-spacing="-10"
    stroke="#163d7d"
    stroke-linejoin="round"
    stroke-width="4"
  >
    <text x="42" y="284" font-size="258">KARE</text>
    <text x="44" y="562" font-size="258">PLUS</text>
  </g>

  <text
    x="86"
    y="726"
    fill="url(#kare-plus-stacked-green)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="66"
    letter-spacing="4"
    stroke="#67a92d"
    stroke-width="1"
  >
    THE CARING COMPANY
  </text>
</svg>
